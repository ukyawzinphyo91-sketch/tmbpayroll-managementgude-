<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0a1120">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TMB Payroll Management – Interactive Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--pg:#e6ecf5;--pg2:#d5deec;--tx:#10243f;--mu:#5b6b82;--card:#ffffff;--ln:#cfd9e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#070c16;--pg2:#0b1324;--tx:#e6edf7;--mu:#8fa1ba;--card:#101a2e;--ln:#22314d}}
:root[data-theme="dark"]{--pg:#070c16;--pg2:#0b1324;--tx:#e6edf7;--mu:#8fa1ba;--card:#101a2e;--ln:#22314d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% 0%,var(--pg2),var(--pg));color:var(--tx);font-family:"Figtree","Noto Sans Myanmar","Padauk",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:44px;padding:16px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.my{font-family:"Noto Sans Myanmar","Padauk","Figtree",system-ui,sans-serif}

/* ───────── Phone shell ───────── */
.phone{--bg:#0a1120;--cd:#1a2845;--cd2:#141f38;--ln:#263759;--t:#eef2fa;--m:#9db0cb;--gr:#17803f;--gt:#2fc27b;--rd:#e0524f;--amb:#ffb020;
 position:relative;width:404px;height:min(852px,calc(100dvh - 32px));min-height:600px;background:var(--bg);color:var(--t);border-radius:46px;border:10px solid #04070d;
 box-shadow:0 0 0 2px #1a2233,0 40px 80px -24px rgba(0,0,0,.65);overflow:hidden;display:flex;flex-direction:column;font-size:15px;line-height:1.35;flex:none;isolation:isolate}
.phone.ios{--bg:#08142a}
.rst{position:absolute;top:9px;right:14px;z-index:5;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#eef2fa;font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer}
.rst:hover{background:rgba(255,255,255,.26)}
[data-n]{cursor:pointer}
.sb{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;height:40px;padding:6px 22px 0;font-weight:600;font-size:14px;z-index:3;background:var(--bg)}
.phone.ios .sb{height:50px;padding-top:12px}
.isl{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:106px;height:30px;border-radius:20px;background:#000}
.ri{display:flex;align-items:center;gap:6px}.sg{display:inline-flex;align-items:flex-end;gap:1px}.sg sup{font-size:7px;font-weight:700;line-height:1;margin-right:1px;position:relative;top:-6px}
.bat{background:#e9edf4;color:#0a1120;border-radius:6px;padding:0 5px;font-size:11px;font-weight:800;line-height:15px;height:15px;min-width:22px;text-align:center}
#scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;overscroll-behavior:contain}
#scr::-webkit-scrollbar{display:none}
#scr.fade>*{animation:fi .28s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.pad{padding:14px 16px 24px}
.ic{display:block;flex:none}
.sub{color:var(--m);font-size:14px}
.cap{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#c3cfe3;font-weight:500}

/* bottom bars */
#bot{flex:none;position:relative;z-index:3}
.andnav{height:46px;background:#e8e9ee;color:#575b66;display:flex;justify-content:space-around;align-items:center}
.andnav span{width:70px;display:grid;place-items:center}
.hind{height:22px;background:var(--bg);display:grid;place-items:center}.hind i{width:128px;height:5px;border-radius:9px;background:#d9dfea;opacity:.9}
.tabbar{display:flex;justify-content:space-around;align-items:flex-end;padding:10px 4px 2px;background:#08142a;border-top:1px solid #16315a}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#e6ecf6;min-width:66px;padding:2px 4px;border-radius:12px}
.tab.on{color:var(--gt)}
.tab.home{margin-top:-30px}.hc{width:58px;height:58px;border-radius:50%;background:#12a05a;border:4px solid #08142a;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(18,160,90,.35)}

.tm{display:inline-flex;align-items:center;gap:7px}.tg{width:19px;height:19px;border-radius:6px;background:#2a9fd8;display:grid;place-items:center}
.tabbar.and{background:#0a1120;border-top:1px solid #1c2a44;padding:8px 2px 4px}.tabbar.and .tab{font-size:13px;letter-spacing:-.1px;color:#e6ecf6;min-width:0;flex:1}.tabbar.and .tab.home{margin-top:-30px}
.tabbar.and .hc{background:#17803f;border-color:#0a1120;box-shadow:none}.tab.hot{color:#fff;font-weight:700}
.tab span{white-space:nowrap}
.hh{display:flex;align-items:center;gap:12px}.hh .t{flex:1;min-width:0}.hh .g{font-size:19px;color:#e9eef8;line-height:1.1}.hh svg,.tip svg,.tb2 svg{flex:none}.hh h1{margin:2px 0 0;white-space:nowrap;font-size:26px;font-weight:600;line-height:1.1}
.bellb{position:relative;width:48px;height:48px;border-radius:15px;background:#121f38;border:1px solid #2a3c60;display:grid;place-items:center;color:#eef2fa;flex:none}
.bellb i{position:absolute;top:-9px;right:-10px;background:#e8433f;color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:99px;padding:2px 7px;border:2px solid #0a1120}
.tb2{position:relative;margin-top:18px;border-radius:22px;padding:18px 18px 20px;background:linear-gradient(135deg,#1b3a37,#1d2e4e 70%);border:1px solid #2b4560;overflow:hidden}
.tb2 .wm{position:absolute;right:-14px;top:-18px;width:130px;height:130px;border-radius:50%;border:1px dashed rgba(255,255,255,.18);display:grid;place-items:center;opacity:.5}
.tb2 .lb2{font-size:17px;color:#e9eef8;display:flex;justify-content:space-between;align-items:center;position:relative}
.tb2 .bigv{font-size:30px;font-weight:700;margin:14px 0 20px;letter-spacing:-.3px;line-height:1.1;position:relative;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(3,1fr);row-gap:16px;text-align:center}
.acts div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15.5px;color:#e9eef8}
.acts .ti{width:47px;height:47px;border-radius:14px;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#f1f5fb}
.tb2 hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:16px 6px}
.tip{display:flex;gap:12px;align-items:center;margin-top:14px;border:1px solid #14403a;background:#0e2a29;border-radius:16px;padding:14px;font-size:17px;line-height:1.3;color:#eef2fa}
.tip b{color:#2fc27b;font-weight:500}
/* top bar of sub-pages */
.top{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 18px;border-bottom:1px solid #1b2a47;background:var(--bg);font-weight:600;font-size:18px}
.top .tl{justify-self:start;font-weight:400;color:#dfe6f3}.top .tl.g{color:#2a9a5a}
.top .tr{justify-self:end;font-weight:600;color:#4b5b78;padding:2px 6px;border-radius:8px}.top .tr.on{color:var(--gt)}
.phead{display:flex;align-items:center;gap:14px;padding:6px 18px 6px}
.phead .bk{color:#2a9a5a}.phead h2{margin:0;font-size:27px;font-weight:600;line-height:1.1}.phead .sub{font-size:16px;color:#cdd7e8}
.pbtn{margin-left:auto;width:38px;height:38px;border-radius:50%;background:#16784a;display:grid;place-items:center;color:#e9fff3}

/* generic fields */
.lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#e9eef8;margin:20px 0 6px}
.lbl.s{font-size:12.5px;margin:14px 0 6px;letter-spacing:.06em}
.lbl.red{color:#e0524f}.lbl.grn{color:#2fc27b}
.hint{color:#c9d3e6;font-size:15px;margin:0 0 12px;line-height:1.4}
.fld{background:#1c2b48;border:1px solid rgba(255,255,255,.045);border-radius:12px;padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:17px;margin-bottom:2px}
.fld.ph{color:#b9c6dd}.fld.sel .ell{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .cur-t{color:#d6e0f1;font-size:15px;margin-right:10px}.fld .v{font-weight:600;font-size:19px;margin-right:auto}
.money{justify-content:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{font-size:14px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;margin:24px 0 0;color:#f1f5fc}
.card{background:var(--cd);border:1px solid #2a3c60;border-radius:18px;padding:16px}
.card.row{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:15px 16px}
.card.row .mid{flex:1;min-width:0}.card.row>.ic:last-child{color:#cfd9ea}
.big2{font-size:20px;font-weight:600;line-height:1.2;margin:3px 0 2px}
.ico{width:44px;height:44px;border-radius:50%;background:#12302f;color:#1f8a58;display:grid;place-items:center;flex:none}
.ico2{width:30px;height:30px;color:#fff;display:grid;place-items:center;flex:none}
.bal{display:flex;justify-content:space-between;gap:10px;margin:8px 0 14px;padding:18px 16px}
.bal .l{max-width:150px}.bal .amt{font-size:25px;font-weight:600;line-height:1.25;margin:5px 0 6px}
.bal .rt{text-align:right;padding-top:46px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;background:#10343a;color:#2fb872;font-size:13px;padding:6px 12px;white-space:nowrap}
.pr{margin-top:8px;font-size:12px;color:#2fc27b}
.eh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.eh b{font-size:20px;font-weight:600}.eh .add{color:var(--gt);font-weight:600;font-size:17px;padding:2px 6px;border-radius:8px}
.ecard{background:var(--cd);border:1px solid #2a3c60;border-radius:18px;margin-bottom:12px;overflow:visible}
.erow{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;background:#12302f;color:#2fc27b}
.av.x{background:#3a1b24;color:#e0524f}.av.g{background:#10241f;color:#1f9d62;font-size:15px;opacity:.9}
.emid{flex:1;min-width:0}.nm{display:flex;align-items:center;gap:6px;min-width:0}.nm b{font-size:18px;font-weight:600;flex:none;max-width:100%;white-space:nowrap}.nm .tag{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:#0f3a33;color:#2fc27b;white-space:nowrap}.tag.x{background:#4a1f26;color:#e0524f}
.em{color:#d3dcec;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eam{text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex:none;max-width:52%}.eam b{font-size:17px;font-weight:600;white-space:nowrap}.eam small{font-size:12px;color:#c3cfe3;white-space:nowrap;margin-top:2px}
.edit{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-top:1px solid #2a3c60;font-size:16.5px;border-radius:0 0 18px 18px}

/* business (iOS) */
.biz .pad{padding:8px 16px 18px}
.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.bh h1{margin:0;font-size:32px;font-weight:700;line-height:1.1}.bh .sub{font-size:20px;line-height:1.2;margin-top:6px;color:#b5c3dc;max-width:200px}
.sel2{display:flex;align-items:center;gap:8px;border:1px solid #1f4a85;background:rgba(22,52,96,.55);border-radius:14px;padding:10px 13px;font-size:17px;font-weight:600}
.act{display:inline-flex;align-items:center;gap:9px;border:1px solid #14754b;background:rgba(14,90,60,.38);color:#27d083;border-radius:99px;padding:8px 14px;font-size:16px;font-weight:600;margin:14px 0 14px}
.bg2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bc{position:relative;text-align:left;background:linear-gradient(160deg,rgba(23,58,108,.62),rgba(13,36,72,.62));border:1px solid #1f4a85;border-radius:22px;padding:16px;min-height:196px;color:#fff}
.bc .ar{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center}
.bc .bi{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.bc b{display:block;font-size:19px;font-weight:600;line-height:1.25}.bc .vm{font-size:17px;color:#b5c3dc;margin-top:6px}.bc .tmc{font-size:22px;font-weight:700;margin-top:6px;line-height:1.25}
.bl{display:flex;align-items:center;gap:14px;background:linear-gradient(160deg,rgba(23,58,108,.55),rgba(13,36,72,.55));border:1px solid #1f4a85;border-radius:20px;padding:16px;margin-top:14px;text-align:left;width:100%;color:#fff}
.bl .bi{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none}.bl .mid{flex:1;min-width:0}.bl b{font-size:19px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bl .s{font-size:15.5px;color:#b5c3dc;line-height:1.3}
.bl .rg{text-align:right;font-weight:700;font-size:18px;white-space:nowrap;flex:none}.bl .rg i{display:block;width:9px;height:9px;border-radius:50%;background:#1ed37b;margin:8px 4px 0 auto}

/* login */
.lg{text-align:center;padding:18px 20px}.logo{width:104px;height:104px;border-radius:30px;background:#14573a;display:grid;place-items:center;font-size:36px;font-weight:700;margin:26px auto 22px}
.lg h1{margin:0;font-size:26px}.lg .sub{font-size:17px;margin:8px 0 24px}
.seg{display:flex;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:5px;margin-bottom:16px}.seg span{flex:1;padding:11px;border-radius:10px;color:var(--m)}.seg .on{background:#233352;color:var(--t)}
.lg .card{text-align:left;padding:18px}.lg .lbl{margin:0 0 8px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--gr);color:#fff;font-weight:700;padding:15px;font-size:17px;text-align:center}
.lg .btn{margin-top:14px;position:relative}

/* net pay + schedule + manual */
.net{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0b2a29;border:1px solid #15403a;border-radius:14px;padding:16px;margin:16px 0 4px}
.net .l{color:#2fc27b;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;max-width:150px}.net .l div{text-transform:none;letter-spacing:0;font-size:14px;line-height:1.3;font-weight:400}.net .l .r{color:#e0524f}
.net .l .g{color:#2fc27b}
.net b{color:#2fd488;font-size:24px;font-weight:700;white-space:nowrap}
.ov{color:#1fae6a;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;margin:0 0 6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}.chips span{text-align:center;border:1px solid #223455;border-radius:12px;padding:13px 4px;font-size:16.5px;color:#eef2fa;background:rgba(255,255,255,.015)}.chips .on{background:#17803f;border-color:#17803f;color:#fff}
.opt{background:#1c2b48;border-radius:12px;padding:16px 18px;margin-bottom:10px;font-size:17px}.opt.on{background:#17803f}
.prev{display:flex;align-items:flex-start;gap:12px;margin-top:20px;background:#0b2724;border:1px solid #11332f;border-radius:14px;padding:16px;color:#2a9a63}.prev b{display:block;font-size:18px;font-weight:500}.prev small{font-size:14px}
.sc2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sc2 .c{background:#1a2845;border:1px solid #2a3c60;border-radius:14px;padding:11px 8px;text-align:center}.sc2 .c .cap{font-size:12.5px}.sc2 .c b{font-size:17px;font-weight:600;white-space:nowrap}
.pms{margin-top:12px;background:#1a2845;border:1px solid #2a3c60;border-radius:14px;padding:12px 14px;display:flex;gap:10px;color:#2a9a63}.pms>div{color:#e9eef8}.pms b{font-size:18px;font-weight:600;display:block}.pms span{font-size:15px;color:#d3dcec;line-height:1.35}
.selrow{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;font-size:17px}.selrow .a{color:#2a9a5a;margin-right:10px}
.ecard2{border:1px solid #2a3c60;border-radius:16px;padding:14px 16px;margin:6px 0 22px;background:rgba(255,255,255,.012)}
.er{display:flex;align-items:center;gap:12px}.cb{width:24px;height:24px;border-radius:6px;background:#17803f;display:grid;place-items:center;color:#fff;flex:none}
.er .av{width:38px;height:38px;font-size:13px;background:#10241f;color:#1f9d62}.er b{font-size:19px;font-weight:600}.er small{display:block;color:#d3dcec;font-size:14.5px}
.ecard2 .cap{margin-top:16px;font-size:13.5px;letter-spacing:.06em;padding:0 0 0 0;display:block}.ecard2 .am{font-size:21px;font-weight:700;margin:6px 0 4px}.ecard2 .fee{font-size:14.5px;color:#d3dcec}
.skip{border:1px solid #223455;border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;color:#9db0cb;margin-top:8px}
.pay{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px;background:#17803f;border-radius:14px;padding:17px;font-size:19px;font-weight:600;color:#fff}

/* ───────── Guide: yellow dot (strictly sequential) ───────── */
.cur{position:relative;cursor:pointer;outline:2px solid rgba(255,176,32,.6);outline-offset:3px}
.cur::after{content:"";position:absolute;top:-8px;right:-8px;width:16px;height:16px;border-radius:50%;background:var(--amb,#ffb020);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);animation:pl 1.5s infinite;pointer-events:none;z-index:6}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,176,32,.75)}70%,100%{box-shadow:0 0 0 12px rgba(255,176,32,0)}}
.cur.shake{animation:sk .38s}
@keyframes sk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.tab.cur{outline-offset:1px}
.tab.cur::after{top:-4px;right:4px}
@media (prefers-reduced-motion:reduce){.cur::after{animation:none}.cur.shake{animation:none}#scr.fade>*{animation:none}.gc{animation:none!important}}

#sh{position:absolute;inset:0;display:none;align-items:flex-end;z-index:20}#sh.on{display:flex}
.dim{position:absolute;inset:0;background:rgba(2,6,14,.5)}
.gc{position:relative;width:100%;background:#f7f9fd;color:#14213a;border-radius:26px 26px 0 0;padding:20px 20px 22px;box-shadow:0 -12px 40px rgba(0,0,0,.35);animation:up .26s ease-out;font-family:"Noto Sans Myanmar","Padauk","Figtree",system-ui,sans-serif}
@keyframes up{from{transform:translateY(46px);opacity:0}}
.gc .bd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.gc small{display:inline-block;background:#fff0cc;color:#7a4f00;border-radius:99px;padding:3px 11px;font-weight:700;font-size:12px}
.gc em{font-style:normal;font-size:12px;font-weight:700;color:#6b7a93;font-family:"Figtree",sans-serif}
.gc h3{margin:6px 0 4px;font-size:18px;line-height:1.5}
.gc p{margin:0 0 16px;font-size:14.5px;line-height:1.95;color:#33425a}
.gc .btn{margin:0;font-family:inherit}
.gc .btn.alt{background:#fff;color:#17803f;border:1.5px solid #17803f;margin-top:10px}
#tt{position:absolute;left:16px;right:16px;top:64px;border-radius:12px;padding:12px 14px;font-size:14px;text-align:center;z-index:30;display:none;font-weight:700;font-family:"Noto Sans Myanmar","Figtree",sans-serif;line-height:1.7;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#tt.ok{background:#e4f8ec;color:#0d5a31}#tt.hint{background:#fff3d6;color:#6b4300}

/* side panel */
.side{width:268px;flex:none;color:var(--tx)}
.side h1{font-size:15px;margin:0 0 4px;letter-spacing:.02em}.side .sm{color:var(--mu);font-size:13px;line-height:1.9}

/* ───────── render + input (every [data-n] element is always live) ───────── */
function render(){
  if(scr==="edit"&&!E())scr="pay";
  const sc=SC[scr](),scrEl=$("#scr"),ph=$("#phone"),same=lastScr===scr,y=scrEl.scrollTop;
  ph.className="phone "+sc.dev+(sc.cls?" "+sc.cls:"");
  $("#sb").innerHTML=sbar(sc.dev,sc.time,sc.bat,sc.tg);
  scrEl.classList.toggle("fade",!same);scrEl.innerHTML=sc.html;
  $("#bot").innerHTML=sc.bot==="and"?ANAV:sc.bot||"";
  scrEl.scrollTop=same?y:0;lastScr=scr;
  scrEl.querySelectorAll("[data-n]").forEach(el=>{el.tabIndex=0;el.setAttribute("role","button")});
  syncBackButton();
}
function toast(t,k="ok"){haptic(k==="ok"?"ok":"warn");const x=$("#tt");x.textContent=t;x.className=k;x.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>x.style.display="none",k==="ok"?2400:2200)}
function reset(){clearProgress();S=fresh();scr="login";lastScr="";$("#tt").style.display="none";render();}

function fire(id){
  if(id==="back"){goBack();return}
  const[k,arg]=id.split(":"),n=NAV[k];if(!n)return;
  if(n.act&&n.act(arg)===false)return;
  const tx=typeof n.toast==="function"?n.toast(arg):n.toast;if(tx)toast(tx);
  if(n.to)scr=n.to;
  render();saveProgress();
}
$("#phone").addEventListener("click",e=>{const t=e.target.closest("[data-n]");if(t){fire(t.dataset.n);return}
 if(e.target.closest(".tab:not(.hot),.acts>div,.bc,.bl,.sel2,.bellb,.seg span:not(.on),.edit"))hint();});
$("#phone").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.tagName!=="INPUT"&&e.target.closest&&e.target.closest("[data-n]")){e.preventDefault();fire(e.target.closest("[data-n]").dataset.n);}});
$("#phone").addEventListener("input",e=>{const t=e.target,k=t.dataset&&t.dataset.f;if(!k)return;const v=t.value,[a,b]=k.split(":");
 if(a==="login")S.me=v;else if(a==="f")S.f[b]=v;else if(a==="bal")S.bal=num(v);
 else if(a==="run")E(b).run=v.trim()===""?null:num(v);
 else{const m=E();if(["b","fi","lv","ot","al"].includes(a))m[a]=num(v);else if(a==="ov")m.ov=v.trim()===""?null:num(v);else m[a]=v}
 live();saveProgress()});
$("#rs").onclick=reset;
function share(){const u=location.href.split("#")[0],t="TMB Payroll – Interactive Guide",tl="https://t.me/share/url?url="+encodeURIComponent(u)+"&text="+encodeURIComponent(t);
 if(IN_TG){try{TWA.openTelegramLink(tl);return}catch(e){}}
 if(navigator.share){navigator.share({title:t,url:u}).catch(()=>{});return}
 try{navigator.clipboard.writeText(u);toast("လင့်ခ် copy ကူးပြီးပါပြီ ✓")}catch(e){window.open(tl,"_blank")}}
$("#sh2").onclick=share;

loadProgress(saved=>{
  if(saved&&saved.scr&&SC[saved.scr]&&saved.S&&Array.isArray(saved.S.emps)){S=Object.assign(fresh(),saved.S);uid=Math.max(0,...S.emps.map(e=>+String(e.id).slice(1)||0));scr=saved.scr;render();}
  else{render();}
});
</script>
